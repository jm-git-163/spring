<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐶🐱 동물상 테스트 (Animal Face Test)</title>
  <link href="./style.css" rel="stylesheet">
  <!-- TensorFlow.js 및 Teachable Machine Image 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body class="light-mode">
  <div class="container">
    <header>
      <h1>🐶🐱 동물상 테스트</h1>
      <button id="theme-toggle" class="btn-theme">🌓 테마 변경</button>
    </header>
    
    <main>
      <section class="upload-section">
        <p class="subtitle">나의 동물상을 확인해보세요!</p>
        <div class="upload-container" id="upload-container">
          <input type="file" id="image-upload" accept="image/*" hidden>
          <div id="upload-placeholder" class="upload-placeholder">
            <span class="upload-icon">📸</span>
            <p>사진을 클릭하여 업로드하세요</p>
          </div>
          <img id="image-preview" src="" alt="미리보기" hidden>
        </div>
        <div id="loading" class="loading" hidden>
          <div class="spinner"></div>
          <p>인공지능이 분석 중입니다...</p>
        </div>
      </section>

      <section id="result-section" class="result-section" hidden>
        <h2 id="result-title"></h2>
        <div id="label-container" class="label-container">
          <!-- 결과 막대 그래프가 동적으로 생성됩니다. -->
        </div>
        <button id="retry-btn" class="btn-retry">다시 하기</button>
      </section>
    </main>

    <section class="comments-section">
      <h3>💬 댓글</h3>
      <div id="disqus_thread"></div>
      <script>
          /**
          *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
          *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */

          this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
          this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
          };
          */

          var d = document, s = d.createElement('script');
          s.src = 'https://productbuilder-jqbafca0xd.disqus.com/embed.js';

          (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </section>
  </div>
  <script defer src="./main.js"></script>
</body>
</html>
