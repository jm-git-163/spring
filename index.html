<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추천 게임</title>
  <link href="/style.css" rel="stylesheet">
</head>
<body class="light-mode">
  <div class="container">
    <header>
      <h1>🎰 로또 추천기</h1>
      <button id="theme-toggle" class="btn-theme">🌓 테마 변경</button>
    </header>
    
    <main>
      <div id="lotto-display" class="ball-container">
        <span class="ball placeholder">?</span>
        <span class="ball placeholder">?</span>
        <span class="ball placeholder">?</span>
        <span class="ball placeholder">?</span>
        <span class="ball placeholder">?</span>
        <span class="ball placeholder">?</span>
      </div>
      
      <button id="generate-btn" class="btn-generate">번호 생성하기</button>
    </main>

    <section class="history-section">
      <h3>최근 생성된 번호</h3>
      <ul id="history-list"></ul>
    </section>

    <section class="contact-section">
      <h3>🤝 제휴 문의</h3>
      <form action="https://formspree.io/f/xdapybdb" method="POST" id="contact-form">
        <div class="form-group">
          <label for="email">이메일 주소</label>
          <input type="email" name="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">문의 내용</label>
          <textarea name="message" id="message" rows="4" placeholder="문의하실 내용을 입력해주세요." required></textarea>
        </div>
        <button type="submit" class="btn-submit">문의 보내기</button>
      </form>
    </section>
  </div>
  <script defer src="./main.js"></script>
</body>
</html>
